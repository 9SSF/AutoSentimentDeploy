# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

# 触发条件：当推送代码到 main 分支，或对 main 分支提交 PR 时触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==================== 1. CI 自动化测试阶段 ====================
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 3.11/3.12 运行时
          cache: 'pip'          # 开启 pip 依赖缓存，加快后续构建

      - name: 3. 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 4. 运行 Pytest 单元测试
        run: |
          python -m pytest

  # ==================== 2. CD Docker 容器构建阶段 ====================
  docker-build:
    name: Build & Validate Docker Image
    needs: test # 只有 test job 成功通过后，才会执行此构建
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 Docker Buildx (构建引擎)
        uses: docker/setup-buildx-action@v3

      - name: 3. 构建并校验 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # 仅测试构建，暂不推送到公网仓库
          tags: autoai-sentiment-api:latest
          cache-from: type=gha # 利用 GitHub Actions 的缓存层加速构建
          cache-to: type=gha,mode=max